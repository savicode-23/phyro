name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      create_draft:
        description: Create a draft GitHub Release after both packages pass (default branch or version tag)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable

jobs:
  version:
    name: Check version and source
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.source.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CREATE_DRAFT: ${{ inputs.create_draft }}
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "phyro") | .version')
          tag="refs/tags/v$version"
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" != "$tag" ]]; then
            echo "::error::The pushed tag must be v$version to match Cargo.toml."
            exit 1
          fi
          if [[ "$CREATE_DRAFT" == true && "$GITHUB_REF" != "$tag" && "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::To create a draft, choose the default branch or the matching version tag."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: rustup component add rustfmt
      - run: cargo fmt --all --check
      - run: python3 -m unittest discover -s scripts/tests

  package:
    name: Build and verify ${{ matrix.platform }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
          - platform: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      COMMIT: ${{ needs.version.outputs.commit }}
      PLATFORM: ${{ matrix.platform }}
      TARGET: ${{ matrix.target }}
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup component add rust-docs
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dri libegl-dev libgl-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libx11-dev xvfb xauth xdotool
      - run: cargo test --locked --release --workspace --target "$TARGET"
      - run: cargo build --locked --release --target "$TARGET" -p phyro -p phyro-cli
      - name: Package and run the extracted CLI
        run: |
          python scripts/release_notices.py --target "$TARGET" --out target/release-notices
          python scripts/package_release.py --version "$VERSION" --revision "$COMMIT" --platform "$PLATFORM" --bin-dir "target/$TARGET/release" --notices-dir target/release-notices --out-dir dist
      - name: Launch the packaged Linux editor
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          archive="Phyro-${VERSION/+/_}-$PLATFORM"
          tar -xzf "dist/$archive.tar.gz" -C "$RUNNER_TEMP"
          export APP="$RUNNER_TEMP/$archive"
          xvfb-run -a bash -eu <<'SMOKE'
          unset WAYLAND_DISPLAY
          "$APP/phyro" "$APP/lantern-walk.vanim" &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in {1..80}; do
            kill -0 "$pid"
            if xdotool search --onlyvisible --pid "$pid" --name Phyro >/dev/null; then exit 0; fi
            sleep 0.25
          done
          echo "Timed out waiting for the packaged editor window."
          exit 1
          SMOKE
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/Phyro-*
          if-no-files-found: error
          compression-level: 0
          overwrite: true
      - name: Retain matching Windows crash symbols
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-symbols-${{ needs.version.outputs.commit }}
          path: target/${{ matrix.target }}/release/phyro.pdb
          if-no-files-found: error
          overwrite: true

  checksums:
    name: Verify both archives and write SHA256SUMS
    needs: [version, package]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*-x64
          path: dist
          merge-multiple: true
      - env:
          VERSION: ${{ needs.version.outputs.version }}
        working-directory: dist
        run: |
          name="Phyro-${VERSION/+/_}"
          sha256sum "$name-windows-x64.zip" "$name-linux-x64.tar.gz" > SHA256SUMS
          sha256sum --check SHA256SUMS
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: dist/SHA256SUMS
          if-no-files-found: error
          overwrite: true

  draft:
    name: Prepare draft GitHub Release
    needs: [version, checksums]
    if: github.event_name == 'push' || inputs.create_draft
    runs-on: ubuntu-24.04
    concurrency: release-draft-${{ needs.version.outputs.version }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - run: sha256sum --check SHA256SUMS
        working-directory: dist
      - name: Prepare the tag and upload verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          COMMIT: ${{ needs.version.outputs.commit }}
        run: python3 scripts/draft_release.py "$VERSION" "$COMMIT" dist
