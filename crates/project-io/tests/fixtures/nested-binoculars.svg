        <ellipse id="left-glass" cx="32" cy="42" rx="16" ry="14" fill="#429894"/>
        <path id="left-glint" d="M20 42Q21 31 34 30Q27 32 24 41Z" fill="#c4eee1"/>
      </g>
      <rect id="bridge" x="38" y="29" width="32" height="12" fill="#ad724e"/>
      <g id="right" inkscape:label="Right lens" transform="translate(74 42)">
        <ellipse id="right-rim" cx="0" cy="0" rx="21" ry="19" fill="#152734"/>
        <ellipse id="right-glass" cx="0" cy="0" rx="16" ry="14" fill="#418b8b"/>
        <g id="reflections" inkscape:label="Reflections" transform="rotate(8)">
          <path id="right-glint" d="M-12 1Q-10 -11 3 -12Q-4 -9 -7 0Z" fill="#c4eee1"/>
          <circle id="flare" cx="6" cy="-6" r="2"
